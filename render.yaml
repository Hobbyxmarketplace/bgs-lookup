services:
  - type: web
    name: bgs-lookup
    env: python
    region: oregon # beckett.com's CloudFront flat-blocks Render's Singapore region -- Oregon works
    plan: free
    rootDir: web
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: BECKETT_SESSION_STATE
        sync: false
      - key: BECKETT_EMAIL
        sync: false
      - key: BECKETT_PASSWORD
        sync: false
