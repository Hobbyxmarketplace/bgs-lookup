name: Refresh Beckett session

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Log in and capture session
        env:
          BECKETT_EMAIL: ${{ secrets.BECKETT_EMAIL }}
          BECKETT_PASSWORD: ${{ secrets.BECKETT_PASSWORD }}
        run: python3 scripts/auto_login.py

      - name: Push session to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python3 scripts/push_session_to_render.py
